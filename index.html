<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backlog Musical</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100vh;overflow-x:hidden;background:#03020d;font-family:'Segoe UI',sans-serif;color:#e0d8f8}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:2;min-height:100vh}
header{text-align:center;padding:2.8rem 1rem 1rem}
header h1{font-size:2rem;font-weight:300;letter-spacing:.22em;color:#c4aff8;text-shadow:0 0 70px rgba(160,100,255,.38)}
header p{font-size:.8rem;color:#5050a0;letter-spacing:.1em;margin-top:.45rem}
nav{display:flex;justify-content:center;gap:.5rem;padding:.75rem 1rem 1.6rem}
nav button{background:transparent;border:1px solid rgba(160,100,255,.22);color:#8878c0;padding:.42rem 1.8rem;border-radius:999px;cursor:pointer;font-size:.84rem;letter-spacing:.06em;transition:all .2s}
nav button.active,nav button:hover{background:rgba(120,70,220,.17);border-color:rgba(180,130,255,.55);color:#d0b8ff}
.page{display:none}.page.active{display:block}
.ptitle{text-align:center;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(120,110,180,.35);padding:.2rem 1rem 1.4rem}
.cs-outer{position:relative;overflow:hidden;height:500px;display:flex;align-items:center;perspective:1200px}
.cs-track{display:flex;align-items:center;position:absolute;left:50%;transition:margin-left .52s cubic-bezier(.4,0,.2,1)}
.cs-card{position:relative;width:250px;height:370px;flex-shrink:0;margin:0 14px;cursor:pointer;transition:all .44s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.cs-card .face{width:100%;height:100%;border-radius:10px;overflow:hidden;border:1px solid rgba(160,100,255,.13);box-shadow:0 18px 55px rgba(0,0,0,.75)}
.cs-card img{width:100%;height:70%;object-fit:cover;display:block;background:#0e0920;transition:opacity .45s}
.cs-card .cph{width:100%;height:70%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0e0920,#1c1040);font-size:.7rem;color:#504888;text-align:center;padding:.5rem;position:absolute;top:0;left:0;pointer-events:none}
.cs-card .info{padding:.65rem .8rem .55rem;background:rgba(12,8,28,.93);height:30%;display:flex;flex-direction:column;justify-content:center}
.cs-card .info h2{font-size:.8rem;font-weight:500;color:#ddd0f8;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cs-card .info .art{font-size:.68rem;color:#6858a8;margin-top:.2rem}
.cs-card .info .gtag{display:inline-block;margin-top:.28rem;font-size:.6rem;padding:.12rem .42rem;border-radius:999px;background:rgba(100,55,195,.18);color:#9878e0;border:1px solid rgba(100,55,195,.28)}
.cs-card[data-p="0"]{transform:scale(1) rotateY(0);z-index:10;opacity:1;filter:none}
.cs-card[data-p="1"]{transform:scale(.81) rotateY(-24deg) translateX(18px);z-index:7;opacity:.72;filter:saturate(.45) brightness(.68)}
.cs-card[data-p="-1"]{transform:scale(.81) rotateY(24deg) translateX(-18px);z-index:7;opacity:.72;filter:saturate(.45) brightness(.68)}
.cs-card[data-p="2"]{transform:scale(.65) rotateY(-38deg) translateX(28px);z-index:4;opacity:.4;filter:saturate(.2) brightness(.48)}
.cs-card[data-p="-2"]{transform:scale(.65) rotateY(38deg) translateX(-28px);z-index:4;opacity:.4;filter:saturate(.2) brightness(.48)}
.cs-card[data-p="3"]{transform:scale(.52) rotateY(-46deg);z-index:2;opacity:.18;filter:saturate(.05) brightness(.3)}
.cs-card[data-p="-3"]{transform:scale(.52) rotateY(46deg);z-index:2;opacity:.18;filter:saturate(.05) brightness(.3)}
.cs-card[data-far]{opacity:.04;pointer-events:none;filter:saturate(0) brightness(.1)}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:68px;background:rgba(8,4,22,.42);border:1px solid rgba(160,100,255,.1);border-radius:5px;color:rgba(180,140,255,.35);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;z-index:20;backdrop-filter:blur(5px)}
.arr:hover{background:rgba(90,50,190,.2);color:rgba(210,180,255,.8);border-color:rgba(180,130,255,.32)}
#aL{left:5px}#aR{right:5px}
.dots{display:flex;justify-content:center;gap:5px;padding:.65rem 1rem .15rem;flex-wrap:wrap;max-width:560px;margin:0 auto}
.dot{width:4px;height:4px;border-radius:50%;background:rgba(160,100,255,.2);cursor:pointer;transition:all .2s}
.dot.on{background:#9060e0;transform:scale(1.55)}
.ctr{text-align:center;font-size:.7rem;color:#38307a;padding:.18rem;letter-spacing:.05em}
.rv-wrap{max-width:680px;margin:0 auto;padding:.4rem 1.5rem 2.5rem}
.rv-box{background:rgba(14,9,32,.68);border:1px solid rgba(145,95,255,.16);border-radius:13px;padding:1.2rem 1.45rem;backdrop-filter:blur(12px);transition:opacity .28s}
.rv-box .rl{font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:#6858a8;margin-bottom:.45rem}
.stars{display:flex;gap:3px;margin-bottom:.55rem}
.star{width:11px;height:11px;background:#9060e0;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.star.e{background:rgba(150,90,255,.17)}
.rv-box p{font-size:.88rem;line-height:1.72;color:#b5aece;font-style:italic}
.rv-box .ph{color:#484080}
.tr-wrap{max-width:800px;margin:0 auto;padding:1rem 1.5rem 3rem;display:flex;flex-direction:column;gap:.8rem}
.tr-card{background:rgba(13,9,30,.62);border:1px solid rgba(145,95,255,.14);border-radius:11px;padding:.95rem 1.2rem;backdrop-filter:blur(8px);display:grid;grid-template-columns:46px 1fr;gap:.8rem;align-items:start;transition:border-color .2s}
.tr-card:hover{border-color:rgba(155,105,255,.35)}
.tr-num{width:46px;height:46px;border-radius:7px;background:rgba(100,55,190,.13);border:1px solid rgba(100,55,190,.26);display:flex;align-items:center;justify-content:center;font-size:1rem;color:#9870d8;font-weight:300;flex-shrink:0}
.tr-body h3{font-size:.93rem;font-weight:500;color:#ddd0f8}
.tr-body .ta{font-size:.76rem;color:#6358a0;margin-top:.1rem}
.tr-body .rev{font-size:.82rem;line-height:1.65;color:#aca4c8;margin-top:.48rem;font-style:italic}
.tr-body .gtag{display:inline-block;margin-top:.38rem;font-size:.63rem;padding:.1rem .42rem;border-radius:999px;background:rgba(95,48,185,.17);color:#8868d5;border:1px solid rgba(95,48,185,.27)}
#np{position:fixed;bottom:1.1rem;right:1.1rem;z-index:100;background:rgba(12,8,33,.87);border:1px solid rgba(145,95,255,.22);border-radius:9px;padding:.48rem .88rem;font-size:.7rem;color:#7868b0;backdrop-filter:blur(12px);display:flex;align-items:center;gap:.45rem;max-width:220px}
#np .nd{width:6px;height:6px;border-radius:50%;background:#9060e0;animation:pl 1.65s ease-in-out infinite;flex-shrink:0}
@keyframes pl{0%,100%{opacity:.28;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}}
#npt{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="wrap">
<header>
  <h1>✦ backlog musical</h1>
  <p>tudo que você me mandou — ouvi, anotei, sou honesto</p>
</header>
<nav>
  <button class="active" onclick="showPage('albums')">álbuns</button>
  <button onclick="showPage('tracks')">músicas avulsas</button>
</nav>

<div id="page-albums" class="page active">
  <p class="ptitle">use as setas, teclado ← → ou swipe</p>
  <div class="cs-outer">
    <button class="arr" id="aL" onclick="move(-1)">&#8249;</button>
    <div class="cs-track" id="csT"></div>
    <button class="arr" id="aR" onclick="move(1)">&#8250;</button>
  </div>
  <div class="dots" id="dots"></div>
  <p class="ctr" id="ctr"></p>
  <div class="rv-wrap">
    <div class="rv-box" id="rvBox">
      <div class="rl">resenha crítica</div>
      <div class="stars" id="rvSt"></div>
      <p id="rvTx"></p>
    </div>
  </div>
</div>

<div id="page-tracks" class="page">
  <p class="ptitle">músicas avulsas — indicações do meu amigo</p>
  <div class="tr-wrap" id="trW"></div>
</div>
</div>
<div id="np"><div class="nd"></div><span id="npt">—</span></div>

<script>
// ═══════════════════════════════════════════════════════════════
// ÁLBUNS — edite stars (0-5) e review quando ouvir cada um
// ═══════════════════════════════════════════════════════════════
const ALBUMS = [

    cover:"https://i.scdn.co/image/ab67616d0000b273e7a3d7a5b2c7a0e09e4f2e2a",
    stars:0, review:""
  },
  {

    artist:"Amyl and the Sniffers", year:2019, genre:"Punk Rock",
    cover:"https://upload.wikimedia.org/wikipedia/en/9/9e/Amyl_and_the_Sniffers_-_Amyl_and_the_Sniffers.png",
    stars:0, review:""
  },
  {

  },
  {

  },
  {

    stars:0, review:""
  },
  {
    title:"Eternity",
    artist:"Blaze Bayley", year:1996, genre:"Heavy Metal",
    cover:"https://upload.wikimedia.org/wikipedia/en/5/54/BlazeBayleyEternity.jpg",
    stars:0, review:""
  },
  {
    title:"Excerpts From a Future Past",
    artist:"Matmos", year:2004, genre:"Electronic / Experimental",
    cover:"https://upload.wikimedia.org/wikipedia/en/9/92/Matmos_-_Excerpts_from_a_Future_Past.jpg",
    stars:0, review:""
  },
  {

    stars:0, review:""
  },
  {
    title:"Shakin' All Over",

    cover:"https://upload.wikimedia.org/wikipedia/en/e/e1/Shakin%27_All_Over_Johnny_Kidd.jpg",

  },
  {

    artist:"Steve Miller Band", year:1973, genre:"Rock",
    cover:"https://upload.wikimedia.org/wikipedia/en/c/c9/The_Joker_%28album%29.jpg",
    stars:0, review:""
  },
  {
    title:"Welcome to My Nightmare",

    stars:0, review:""
  },
  {
    title:"Psalm 69",
    artist:"Ministry", year:1992, genre:"Industrial Metal",
    cover:"https://upload.wikimedia.org/wikipedia/en/a/a6/Ministry_psalm69.jpg",
    stars:0, review:""
  },
  {
    title:"Creatures",
    artist:"Fungus Hill", year:2023, genre:"Punk / Garage",
    cover:"",
    stars:0, review:""
  },
];

// ═══════════════════════════════════════════════════════════════
// MÚSICAS — substitua pelos nomes reais quando souber
// ═══════════════════════════════════════════════════════════════
const TRACKS = [
  { num:"01", title:"[música 1]", artist:"[artista]", genre:"—", review:"" },
  { num:"02", title:"[música 2]", artist:"[artista]", genre:"—", review:"" },
  { num:"03", title:"[música 3]", artist:"[artista]", genre:"—", review:"" },
  { num:"04", title:"[música 4]", artist:"[artista]", genre:"—", review:"" },
  { num:"05", title:"[música 5]", artist:"[artista]", genre:"—", review:"" },
];

// ═══════════════════════════════════════════════════════════════
// GALÁXIA — fundo com parallax no mouse
// ═══════════════════════════════════════════════════════════════
const cv=document.getElementById('bg'),cx=cv.getContext('2d');
let W,H,stars=[],nebs=[],mx=.5,my=.5,tx=.5,ty=.5;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
function mkStars(){
  stars=[];nebs=[];
  for(let i=0;i<400;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.55+.18,op:Math.random()*.78+.18,spd:Math.random()*.38+.05,ph:Math.random()*Math.PI*2,px:Math.random()*.65+.18});
  const hues=[255,242,278,208,263,298,225];
  for(let i=0;i<7;i++)nebs.push({x:Math.random()*W,y:Math.random()*H,r:130+Math.random()*270,hue:hues[i%hues.length],op:.028+Math.random()*.048,px:Math.random()*.82+.1});
}
let ft=0;
function draw(){
  ft+=.008;tx+=(mx-tx)*.038;ty+=(my-ty)*.038;
  const dx=(tx-.5)*95,dy=(ty-.5)*58;
  cx.clearRect(0,0,W,H);cx.fillStyle='#03020d';cx.fillRect(0,0,W,H);
  nebs.forEach(n=>{
    const ox=dx*n.px,oy=dy*n.px*.7;
    const g=cx.createRadialGradient(n.x+ox,n.y+oy,0,n.x+ox,n.y+oy,n.r);
    g.addColorStop(0,`hsla(${n.hue},66%,50%,${n.op*1.65})`);g.addColorStop(1,`hsla(${n.hue},66%,28%,0)`);
    cx.fillStyle=g;cx.beginPath();cx.arc(n.x+ox,n.y+oy,n.r,0,Math.PI*2);cx.fill();
  });
  stars.forEach(s=>{
    const tw=Math.sin(ft*s.spd*8+s.ph)*.27+.73;
    const ox=dx*s.px,oy=dy*(s.px*.5+.18);
    cx.beginPath();cx.arc(s.x+ox,s.y+oy,s.r*tw,0,Math.PI*2);
    cx.fillStyle=`rgba(215,205,255,${s.op*tw})`;cx.fill();
  });
  requestAnimationFrame(draw);
}
document.addEventListener('mousemove',e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight});
window.addEventListener('resize',()=>{resize();mkStars()});
resize();mkStars();draw();

// ═══════════════════════════════════════════════════════════════
// CARROSSEL
// ═══════════════════════════════════════════════════════════════
let cur=0;
const CW=250,GM=14;

// fallback: tenta iTunes se a imagem Wikimedia falhar
async function tryItunes(title,artist){
  try{
    const q=encodeURIComponent(`${title} ${artist}`);
    const r=await fetch(`https://itunes.apple.com/search?term=${q}&entity=album&limit=5&media=music`);
    const d=await r.json();
    const res=d.results||[];
    if(res.length){
      const m=res.find(x=>(x.collectionName||'').toLowerCase().includes(title.toLowerCase().slice(0,6)))||res[0];
      return (m.artworkUrl100||'').replace('100x100bb','600x600bb');
    }
  }catch(e){}
  return '';
}

function buildCarousel(){
  const track=document.getElementById('csT');
  const dotsEl=document.getElementById('dots');
  track.innerHTML='';dotsEl.innerHTML='';

  ALBUMS.forEach((a,i)=>{
    const card=document.createElement('div');
    card.className='cs-card';card.dataset.i=i;
    card.innerHTML=`
      <div class="face">
        <div class="cph" id="ph${i}">sem capa</div>
        <img id="img${i}" src="" alt="${a.title}" style="opacity:0">
        <div class="info">
          <h2>${a.title}</h2>
          <div class="art">${a.artist}${a.year?' · '+a.year:''}</div>
          <span class="gtag">${a.genre}</span>
        </div>
      </div>`;
    card.addEventListener('click',()=>{if(+card.dataset.i!==cur)goTo(+card.dataset.i)});
    track.appendChild(card);

    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' on':'');
    dot.onclick=()=>goTo(i);
    dotsEl.appendChild(dot);

    // Carrega imagem: primeiro tenta a URL hardcoded, depois iTunes como fallback
    const loadImg=(src)=>{
      if(!src){tryItunes(a.title,a.artist).then(u=>u&&loadImg(u));return}
      const el=document.getElementById('img'+i);
      const ph=document.getElementById('ph'+i);
      el.onload=()=>{el.style.opacity=1;ph.style.display='none'};
      el.onerror=()=>{
        if(el.dataset.tried){ph.textContent='sem capa';return}
        el.dataset.tried='1';
        tryItunes(a.title,a.artist).then(u=>{if(u)loadImg(u)});
      };
      el.src=src;
    };
    loadImg(a.cover);
  });
  updateCarousel();
}

function updateCarousel(){
  [...document.querySelectorAll('.cs-card')].forEach((c,i)=>{
    const p=i-cur;
    c.removeAttribute('data-p');c.removeAttribute('data-far');
    Math.abs(p)<=3?c.setAttribute('data-p',p):c.setAttribute('data-far','');
  });
  document.getElementById('csT').style.marginLeft=`-${cur*(CW+GM*2)+CW/2}px`;
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===cur));
  document.getElementById('ctr').textContent=`${cur+1} / ${ALBUMS.length}`;
  document.getElementById('npt').textContent=`${ALBUMS[cur].title} — ${ALBUMS[cur].artist}`;
  updateReview();
}

function updateReview(){
  const a=ALBUMS[cur];
  const box=document.getElementById('rvBox');
  box.style.opacity=0;
  setTimeout(()=>{
    const st=document.getElementById('rvSt');st.innerHTML='';
    if(a.stars>0)for(let i=1;i<=5;i++){const s=document.createElement('div');s.className='star'+(i>a.stars?' e':'');st.appendChild(s)}
    const rt=document.getElementById('rvTx');
    rt.className=a.review?'':'ph';
    rt.textContent=a.review||'ainda não ouvi — resenha em breve.';
    box.style.opacity=1;
  },220);
}

function move(d){cur=(cur+d+ALBUMS.length)%ALBUMS.length;updateCarousel()}
function goTo(i){cur=i;updateCarousel()}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')move(-1);
  if(e.key==='ArrowRight')move(1);
});
let ts=null;
document.addEventListener('touchstart',e=>{ts=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{
  if(ts===null)return;
  if(Math.abs(ts-e.changedTouches[0].clientX)>45)move(ts>e.changedTouches[0].clientX?1:-1);
  ts=null;
});

// ═══════════════════════════════════════════════════════════════
// MÚSICAS AVULSAS
// ═══════════════════════════════════════════════════════════════
function buildTracks(){
  const wrap=document.getElementById('trW');wrap.innerHTML='';
  TRACKS.forEach(t=>{
    const c=document.createElement('div');c.className='tr-card';
    c.innerHTML=`
      <div class="tr-num">${t.num}</div>
      <div class="tr-body">
        <h3>${t.title}</h3>
        <div class="ta">${t.artist}</div>
        <div><span class="gtag">${t.genre}</span></div>
        <p class="rev">${t.review||'resenha em breve.'}</p>
      </div>`;
    wrap.appendChild(c);
  });
}

function showPage(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.querySelector(`nav button[onclick="showPage('${p}')"]`).classList.add('active');
}

buildCarousel();
buildTracks();
</script>
</body>
</html>
